name: VM7 RT Gate node-id trusted reviewer
on:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  node-review:
    runs-on: ubuntu-latest
    steps:
      - name: Create trusted review thread by immutable PR node id
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api graphql             -f query='mutation($pr:ID!,$commit:GitObjectID!){addPullRequestReview(input:{pullRequestId:$pr,commitOID:$commit,event:COMMENT,threads:[{path:"rt-gate-impact-20260930.txt",line:102,side:RIGHT,body:"VM7 TRUSTED ACTIONS REVIEWER: unresolved security concern 101 Gate1 20260930"}]}){pullRequestReview{id state author{login} comments(first:5){nodes{id body author{login}}}}}}'             -f pr='PR_kwDOUXh6ks8AAAABFz0dIA'             -f commit='a58b909b6ed517c78988582fbfd27abe886788c0'
