name: VM7 RT Gate trusted bot reviewer
on:
  pull_request_target:
    types: [synchronize]
permissions:
  contents: read
  pull-requests: write
jobs:
  trusted-review-thread:
    if: github.event.pull_request.number == 57
    runs-on: ubuntu-latest
    steps:
      - name: Post trusted unresolved security concern
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$REPO/pulls/$PR/comments"             -f body='VM7 TRUSTED BOT REVIEWER: unresolved security concern 101 Gate1 20260930'             -f commit_id="$HEAD_SHA"             -f path='rt-gate-impact-20260930.txt'             -F line=102             -f side='RIGHT'
