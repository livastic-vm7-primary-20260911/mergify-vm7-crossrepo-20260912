name: integration

on:
  pull_request:
  push:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cross-component invariant control
        shell: bash
        run: |
          if [[ -f c.flag && -f d.flag ]]; then
            echo 'CONTROL_INTEGRATION_BROKEN=1'
            exit 1
          fi
          echo 'CONTROL_INTEGRATION_OK=1'
