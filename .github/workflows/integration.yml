name: integration

on:
  pull_request:
  push:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manual-scopes Direct Merge invariant
        shell: bash
        run: |
          if [[ -f g.flag && -f h.flag ]]; then
            echo 'MANUAL_SCOPES_INTEGRATION_BROKEN=1'
            exit 1
          fi
          echo 'MANUAL_SCOPES_INTEGRATION_OK=1'
