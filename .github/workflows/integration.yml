name: integration

on:
  pull_request:
  push:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zero-owner Direct Merge invariant
        shell: bash
        run: |
          if [[ -f i.flag && -f j.flag ]]; then
            echo 'ZERO_OWNER_INTEGRATION_BROKEN=1'
            exit 1
          fi
          echo 'ZERO_OWNER_INTEGRATION_OK=1'
