name: integration

on:
  pull_request:
  push:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Explicit merge-conditions invariant
        shell: bash
        run: |
          if [[ -f e.flag && -f f.flag ]]; then
            echo 'EXPLICIT_INTEGRATION_BROKEN=1'
            exit 1
          fi
          echo 'EXPLICIT_INTEGRATION_OK=1'
