scopes:
  source:
    manual:

queue_rules:
  - name: default
    queue_conditions:
      - check-success = integration
    merge_conditions:
      - check-success = integration

pull_request_rules:
  - name: auto queue connected forged scopes
    conditions:
      - base=main
      - or:
          - scope=connected-m
          - scope=connected-n
    actions:
      queue:
        name: default

merge_protections:
  - name: VM7_R55_MANUAL_SCOPE_NATIVE_GATE_20260930
    if:
      - base = main
      - title = VM7_R55_MANUAL_SCOPE_NATIVE_GATE_20260930
    success_conditions:
      - scope = docs
      - -scope = critical

merge_protections_settings:
  reporting_method: check-runs
  post_comment: false
