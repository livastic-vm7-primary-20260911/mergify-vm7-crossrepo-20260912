scopes:
  source:
    manual:

queue_rules:
  - name: default
    queue_conditions:
      - check-success = integration
    merge_conditions:
      - check-success = integration

pull_request_rules:
  - name: auto queue connected forged scopes
    conditions:
      - base=main
      - or:
          - scope=connected-m
          - scope=connected-n
    actions:
      queue:
        name: default

  - name: r61-vm7-crossimm-normal
    conditions:
      - base = r61-vm7-crossimm-target-20260929
      - title = R61 VM7 CROSS IMMUTABLE SAME OBJECT 20260929
      - body = R61_CROSSIMM_NORMAL
    actions:
      merge:
        method: merge

  - name: r61-vm7-crossimm-dynamic
    conditions:
      - base = r61-vm7-crossimm-target-20260929
      - title = R61 VM7 CROSS IMMUTABLE SAME OBJECT 20260929
      - body = R61_CROSSIMM_DYNAMIC
    actions:
      merge:
        method: merge
        merge_bot_account: "{{ author }}"
