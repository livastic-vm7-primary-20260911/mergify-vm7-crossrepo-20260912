scopes:
  source:
    manual:

queue_rules:
  - name: default
    queue_conditions:
      - check-success = integration
    merge_conditions:
      - check-success = integration

pull_request_rules:
  - name: auto queue connected forged scopes
    conditions:
      - base=main
      - or:
          - scope=connected-m
          - scope=connected-n
    actions:
      queue:
        name: default

  - name: r61-vm7-canon-static
    conditions:
      - base = r61-vm7-canon-target-20260929
      - title = R61 VM7 CANON PRE RELEASE 20260929
      - body = R61_CANON_STATIC
    actions:
      merge:
        method: merge
        merge_bot_account: "livastic-vm7-r61known2-260929"

  - name: r61-vm7-canon-dynamic
    conditions:
      - base = r61-vm7-canon-target-20260929
      - title = R61 VM7 CANON POST RECLAIM 20260929
      - body = R61_CANON_DYNAMIC
    actions:
      merge:
        method: merge
        merge_bot_account: "{{ author }}"
